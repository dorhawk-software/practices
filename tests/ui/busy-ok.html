<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>busy-ok</title>
<style>
body{font:14px/1.4 Helvetica,Arial,sans-serif;background:#fff;color:#222;margin:24px}
.card{background:#f2f2f2;padding:16px;width:360px;border-radius:8px}
.row{display:flex;gap:8px;margin-top:16px}
button{white-space:nowrap;font:inherit;color:#222;background:#e2e2e2;border:0;border-radius:6px;padding:6px 12px;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
button svg{width:12px;height:12px}
button:disabled,[aria-disabled=true]{cursor:default}
@keyframes form{from{opacity:.4}to{opacity:1}}
.forming{animation:form 1.4s ease-in-out infinite alternate}
@media (prefers-reduced-motion: reduce){.forming{animation:none}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(1px)}}
.loop{animation:drift 2s linear infinite}</style></head>
<body>
<div class="card"><p>Pressed: the button says it is opening, takes no presses and shows the work's motion until the app's window shows.</p><div class="row"><button disabled aria-busy="true"><svg class="forming" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#222"/></svg> Opening Enterprise Architect…</button></div>
<div class="row" aria-busy="true"><button aria-disabled="true"><svg class="forming" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#222"/></svg> Installing…</button></div>
<p class="loop" data-allow="motion: the clip the person started plays on">A clip the person started.</p></div>
</body></html>
