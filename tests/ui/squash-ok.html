<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>squash-ok</title>
<style>
body{font:14px/1.4 Helvetica,Arial,sans-serif;background:#fff;color:#222;margin:24px}
.card{background:#f2f2f2;padding:16px;width:360px;border-radius:8px}
.panel{background:#fff;padding:12px;border-radius:6px;margin-top:12px}
@keyframes appear{from{transform:scale(.96);opacity:.9}to{transform:none;opacity:1}}
@keyframes grow{from{height:40px}to{height:80px}}
@keyframes wobble{from{transform:scaleX(1.2)}to{transform:none}}
@media (prefers-reduced-motion: no-preference){.pop{animation:appear .2s ease-out}.panel{animation:grow .3s ease-out}.dot{animation:wobble .4s}}
.dot{display:inline-block;width:12px;height:12px;border-radius:6px;background:#222;transform:scaleY(.8)}</style></head>
<body>
<div class="card"><p>A popover that scales in keeping its shape, a panel whose height grows with its words laid out each frame, and a dot that squashes.</p><div class="panel pop"><p>Laid out at every size.</p></div><span class="dot"></span></div>
</body></html>
