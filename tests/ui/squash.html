<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>squash</title>
<style>
body{font:14px/1.4 Helvetica,Arial,sans-serif;background:#fff;color:#222;margin:24px}
.card{background:#f2f2f2;padding:16px;width:360px;border-radius:8px}
.panel{background:#fff;padding:12px;border-radius:6px;margin-top:12px}
@keyframes fit{from{transform:scaleY(1.6)}to{transform:none}}
@media (prefers-reduced-motion: no-preference){.panel{animation:fit .3s ease-out}}</style></head>
<body>
<div class="card"><p>Settings, the Privacy tab: the window shrinks to fit it.</p><div class="panel"><p>Anonymous usage counts help find what breaks.</p></div></div>
</body></html>
