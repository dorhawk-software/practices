<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>inset-drawing</title>
<style>
body{font:14px/1.4 Helvetica,Arial,sans-serif;background:#fff;color:#222;margin:24px}
.wrap{position:relative;width:320px;padding-top:40px}
.card{background:#f2f2f2;padding:14px 16px;border-radius:8px}
.wrap svg{position:absolute;left:-20px;top:10px;width:120px;height:40px;overflow:hidden}
</style></head>
<body>
<div class="wrap"><div class="card"><p style="margin:0">A drawing's box reaches over this card's top edge; it paints a dot and a cancel line, clear of the text.</p></div><svg viewBox="0 0 120 40" aria-hidden="true"><circle cx="20" cy="14" r="10" fill="#c9a35c"/><path d="M0 35H120" stroke="#c9a35c" stroke-width="2"/></svg></div>
</body></html>
