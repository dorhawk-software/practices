<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>stripe-ok</title>
<style>
body{font:14px/1.4 Helvetica,Arial,sans-serif;background:#fff;color:#222;margin:24px}
.card{background:#f2f2f2;padding:16px;width:320px;border-radius:8px;margin-bottom:16px}
.chip{display:inline-block;background:#a8361a;color:#fff;font-size:12px;font-weight:800;letter-spacing:.5px;border-radius:6px;padding:3px 7px}
.line{font-weight:700;margin:6px 0 0}
.row{background:#e2e2e2;border-bottom:1px solid #bbb;padding:8px 10px}
h2{border-bottom:3px solid #a8361a;font-size:16px;margin:0 0 8px}
.bar{background:#e2e2e2;border-bottom:4px solid #a8361a;border-radius:8px;padding:8px 10px}
.whole{background:#f7e3dc;border:2px solid #a8361a;border-radius:8px;padding:8px 10px;margin-top:8px}
</style></head>
<body>
<div class="card"><span class="chip">NO WAY BACK</span><p class="line">Nothing ends this lock early.</p></div>
<div class="card"><h2>A heading's underline has no ground</h2><div class="row">A hairline under a row</div></div>
<div class="card"><div class="bar" data-allow="stripe: the round's progress along its bottom">Round 2 of 4</div><div class="whole">A box outlined all round</div></div>
</body></html>
