<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>skips-phone</title>
<style>
body{font:14px/1.4 Helvetica,Arial,sans-serif;background:#fff;color:#222;margin:24px}
.card{background:#f2f2f2;padding:16px;width:320px;border-radius:8px}
.row{display:flex;gap:8px;margin-top:16px}
button{white-space:nowrap;font:inherit;color:#222;background:#e2e2e2;border:0;border-radius:6px;padding:6px 12px;display:inline-flex;gap:6px;align-items:center}
button svg{width:12px;height:12px}
.phone{position:relative;width:390px;height:500px;background:#f2f2f2;border-radius:32px;overflow:hidden}
.phone+.phone{margin-top:24px}
.home{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#222}
.main{position:absolute;left:16px;right:16px;bottom:50px}
.main button{width:100%;justify-content:center}
.screen p{margin:0;padding:70px 16px 0}
nav{position:absolute;left:0;right:0;bottom:34px;display:flex;gap:8px;padding:4px 16px}nav button{flex:1;justify-content:center}.list{position:absolute;top:54px;left:0;right:0;bottom:0;overflow-y:auto;padding:0 16px}.list button{display:flex;width:100%;margin-top:8px}
</style></head>
<body>
<!-- What the safe check must not flag: a tab bar sits on the safe area itself; a list that scrolls passes under the home indicator. -->
<div class="phone" data-frame="phone"><p style="margin:0;padding:70px 16px 0">Today</p><nav><button><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#222"/></svg>Today</button><button><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#222"/></svg>Week</button><button><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#222"/></svg>Settings</button></nav><div class="home" data-home-indicator></div></div>
<div class="phone" data-frame="phone"><div class="list"><button><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#222"/></svg>First row</button><button><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#222"/></svg>Second row</button><button><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#222"/></svg>Third row</button><button><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#222"/></svg>Fourth row</button><button><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#222"/></svg>Fifth row</button><button><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#222"/></svg>Sixth row</button><button><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#222"/></svg>Seventh row</button><button><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#222"/></svg>Eighth row</button><button><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#222"/></svg>Ninth row</button><button><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#222"/></svg>Tenth row</button><button><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#222"/></svg>Eleventh row</button><button><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#222"/></svg>Twelfth row</button><button><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#222"/></svg>Last row</button></div><div class="home" data-home-indicator></div></div>
</body></html>
