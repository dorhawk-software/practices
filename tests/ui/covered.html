<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>covered</title>
<style>
body{font:14px/1.4 Helvetica,Arial,sans-serif;background:#fff;color:#222;margin:24px}
.card{background:#f2f2f2;padding:16px;width:320px;border-radius:8px}
.row{display:flex;gap:8px;margin-top:16px}
button{white-space:nowrap;font:inherit;color:#222;background:#e2e2e2;border:0;border-radius:6px;padding:6px 12px;display:inline-flex;gap:6px;align-items:center}
button svg{width:12px;height:12px}
.under{position:relative}.sheet{position:absolute;inset:0;background:#f2f2f2}
</style></head>
<body>
<div class="card under"><p style="color:#d0d0d0">Faint text the sheet covers is not read, so not measured.</p><div class="sheet"><p>The sheet on top.</p></div></div>
<!-- An open sheet's page is inert (Scops, 2026-11-16): its targets aren't measured, even 2 px apart,
     and its text under the scrim isn't read. The scrim sits inside the inert page. -->
<div class="card under" style="margin-top:24px;height:160px">
<div inert><div class="row" style="gap:2px"><button><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#222"/></svg>Edit</button><button><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#222"/></svg>Delete</button></div>
<p style="color:#e8e8e8">Faint under the scrim.</p><div style="position:absolute;inset:0;background:rgba(0,0,0,.4)"></div></div>
<div role="dialog" aria-label="Remove" style="position:absolute;left:0;right:0;bottom:0;background:#fff;padding:12px 16px"><button><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#222"/></svg>Remove it</button></div>
</div>
</body></html>
