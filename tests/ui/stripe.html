<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>stripe</title>
<style>
body{font:14px/1.4 Helvetica,Arial,sans-serif;background:#fff;color:#222;margin:24px}
.card{background:#f2f2f2;padding:16px;width:320px;border-radius:8px;margin-bottom:16px}
.beware{background:#e2e2e2;border-left:4px solid #a8361a;border-radius:8px;padding:8px 10px;margin:0}
.note{background:#e2e2e2;box-shadow:inset 4px 0 0 #a8361a;border-radius:8px;padding:8px 10px;margin-top:8px}
</style></head>
<body>
<div class="card"><p class="beware"><b>No way back.</b> Nothing ends this lock early.</p><p class="note">A stripe drawn by a shadow.</p></div>
</body></html>
