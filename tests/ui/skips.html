<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>skips</title>
<!-- What the checks must not flag (1.6.1), each drawn from a real board:
     a phone drawn mid-scroll, cut by its frame and marked once for clip;
     a lone button under a column centred with flex, not text-align;
     a button in a bottom bar that is a surface of its own;
     a segmented control marked as tabs, a kind apart from the other buttons; an icon button beside a labelled one. -->
<style>
body{font:14px/1.4 Helvetica,Arial,sans-serif;background:#fff;color:#222;margin:24px}
.phone{width:320px;height:200px;overflow:hidden;background:#f2f2f2;border-radius:24px;margin-bottom:24px}
.screen{height:480px;padding:16px}
.lock{width:320px;position:relative;height:200px;background:#f2f2f2;margin-bottom:24px}
.lock .head{display:flex;flex-direction:column;align-items:center;padding-top:24px}
.lock .go{margin:24px 24px 0}
.lock .go button{width:100%;justify-content:center}
button{white-space:nowrap;font:inherit;color:#222;background:#e2e2e2;border:0;border-radius:6px;padding:6px 12px;display:inline-flex;gap:6px;align-items:center;height:32px}
button svg{width:12px;height:12px}
.form{width:320px;background:#f2f2f2;margin-bottom:24px}
.form p{margin:0;padding:16px}
.form .foot{background:#e9e9e9;padding:12px 16px}
.form .foot button{width:100%;justify-content:center}
.seg{display:flex;background:#e2e2e2;border-radius:8px;padding:2px;width:240px;margin-bottom:24px}
.seg button{flex:1;justify-content:center;background:transparent;font-weight:700;height:28px;padding:4px 12px}
.seg button[aria-selected=true]{background:#fff}
.bar{display:flex;gap:8px;align-items:center;width:320px}
</style></head>
<body>
<div class="phone" data-allow="clip: a list that scrolls, drawn mid-scroll"><div class="screen">Settings, drawn mid-scroll: the rest of the screen is under the frame's edge.</div></div>
<div class="lock"><div class="head"><b>The envelope is sealed</b><span>Your messages wait inside.</span></div><div class="go"><button><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#222"/></svg>Unlock</button></div></div>
<div class="form"><p>A form whose bottom bar is a surface of its own, padded like the text.</p><div class="foot"><button><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#222"/></svg>Continue</button></div></div>
<div class="seg" role="tablist"><button role="tab" aria-selected="true">Received</button><button role="tab" aria-selected="false">Sent</button></div>
<div class="bar"><button aria-label="Back" style="width:32px;padding:0;justify-content:center;font-size:20px;font-weight:400"><svg viewBox="0 0 12 12"><path d="M8 2 4 6l4 4" stroke="#222" fill="none"/></svg></button><button><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#222"/></svg>Remind me</button></div>
</body></html>
