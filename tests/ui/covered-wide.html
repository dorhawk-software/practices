<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>covered-wide</title>
<style>
body{font:14px/1.4 Helvetica,Arial,sans-serif;background:#fff;color:#222;margin:24px;width:2200px}
.card{background:#f2f2f2;padding:16px;width:320px;border-radius:8px}
.row{display:flex;gap:8px;margin-top:16px}
button{white-space:nowrap;font:inherit;color:#222;background:#e2e2e2;border:0;border-radius:6px;padding:6px 12px;display:inline-flex;gap:6px;align-items:center}
button svg{width:12px;height:12px}
.under{position:relative}.sheet{position:absolute;inset:0;background:#f2f2f2}
</style></head>
<body>
<div class="card under" style="margin-left:1700px"><p style="color:#d0d0d0">Faint text the sheet covers, past the window's right edge, is not read either.</p><div class="sheet"><p>The sheet on top.</p></div></div>
</body></html>
