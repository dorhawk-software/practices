<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>rounded</title>
<!-- 11 px badges, nothing scaled. Their boxes are fractional (19.6 px high), and the browser
     rounds offsetHeight to 20: 1.6.1 read 19.6 / 20 as a scale and the type as 10.8 px
     (Gentes's "decided" badge, 2026-11-16). -->
<style>
body{font:15px/1.5 Helvetica,Arial,sans-serif;background:#fff;color:#222;margin:24px}
.rec{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:#e4eef6;color:#1f3f5c;font:600 11px/1.6 Helvetica,Arial,sans-serif}
</style></head>
<body>
<h3>Documents, then the app <span class="rec">decided</span></h3>
<p>The list ends above the nest <span class="rec">decided</span> and the apps tuck in <span class="rec">rejected</span>.</p>
</body></html>
