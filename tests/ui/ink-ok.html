<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ink-ok</title>
<style>
body{font:14px/1.4 Helvetica,Arial,sans-serif;background:#fff;color:#222;margin:24px}
.card{background:#f2f2f2;padding:16px;width:320px;border-radius:8px}
.row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
button{white-space:nowrap;font:inherit;font-weight:700;border:0;border-radius:6px;padding:8px 12px;display:inline-flex;gap:8px;align-items:center}
.pl{fill:var(--plane);stroke:none;transform:translate(1.3px,1.3px)}
.ln{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="bin" viewBox="0 0 24 24"><g class="pl"><path d="M6.5 7.5h11l-1 12a1.5 1.5 0 0 1-1.5 1.5H9a1.5 1.5 0 0 1-1.5-1.5z"/></g><g class="ln"><path d="M4 7.5h16M9.5 7.5V5h5v2.5"/><path d="M6.5 7.5h11l-1 12a1.5 1.5 0 0 1-1.5 1.5H9a1.5 1.5 0 0 1-1.5-1.5z"/></g></symbol></defs></svg>
<div class="card"><p>Each glyph keeps one ink: a warm near-black stroke (a neutral, though not pure grey) on the blue plane, a red stroke on a red tint, a white stroke on white over a red fill.</p>
<div class="row"><button style="background:#e2e2e2;color:#211b12"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="--plane:#cfe0f5"><use href="#bin"></use></svg>Clear</button>
<button style="background:#e2e2e2;color:#a8322b"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="--plane:rgba(168,50,43,.2)"><use href="#bin"></use></svg>Delete</button>
<button style="background:#a8322b;color:#fff"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="--plane:rgba(255,255,255,.2)"><use href="#bin"></use></svg>Remove</button></div></div>
</body></html>
