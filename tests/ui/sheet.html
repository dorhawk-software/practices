<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>sheet</title>
<style>
body{font:14px/1.4 Helvetica,Arial,sans-serif;background:#fff;color:#222;margin:24px}
.card{background:#f2f2f2;padding:16px;width:320px;border-radius:8px}
.row{display:flex;gap:8px;margin-top:16px}
button{white-space:nowrap;font:inherit;color:#222;background:#e2e2e2;border:0;border-radius:6px;padding:6px 12px;display:inline-flex;gap:6px;align-items:center}
button svg{width:12px;height:12px}
.phone{position:relative;width:390px;height:500px;background:#f2f2f2;border-radius:32px;overflow:hidden}
.home{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#222}
.main{position:absolute;left:16px;right:16px;bottom:50px}
.main button{width:100%;justify-content:center}
.screen p{margin:0;padding:70px 16px 0}
.screen2{position:relative;width:320px;height:300px;background:#f2f2f2;padding:16px}.sheet{position:absolute;left:0;right:0;bottom:0;padding:16px;background:#fff}
</style></head>
<body>
<div class="screen2"><p style="margin:0 0 8px">The page behind the sheet.</p><div><button><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#222"/></svg>Edit plan</button></div><div class="sheet" role="dialog" aria-label="Remove the plan"><p style="margin:0 0 8px">Remove the plan?</p><button><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="#222"/></svg>Remove</button></div></div>
</body></html>
