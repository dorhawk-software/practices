# Reusable: a Rust project's CI in one call. The lint gate, every test
# with the coverage floors, then (on the default branch) pruning the caches
# newer ones replaced. One job does the building: a second job would
# compile everything again (Crake 6c9fd90: ~11 of 15 minutes).
#
#   jobs:
#     rust:
#       uses: dorhawk-software/practices/.github/workflows/rust-ci.yml@v1
#       permissions: { contents: read, actions: write }
#       with: { gpui: true }
#       secrets: { private-terms: "${{ secrets.PRIVATE_TERMS }}" }
#
# Guide: guides/how-it-works.md. Private repos pay for minutes:
# common/ci-caching.md, "Private repos: CI minutes are a budget".
name: Rust CI

on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner, as JSON (a label, or a list for a self-hosted runner).
        type: string
        default: '"ubuntu-24.04"'
      apt-packages:
        description: Extra Ubuntu packages (space separated).
        type: string
        default: ""
      gpui:
        description: Install what GPUI builds with.
        type: boolean
        default: false
      tools:
        description: Cargo tools beyond the gate's own (comma separated).
        type: string
        default: ""
      coverage:
        description: Run the tests measured, against the coverage floors.
        type: boolean
        default: true
      coverage-extra:
        description: Test scripts to run in the coverage build (space separated).
        type: string
        default: ""
      prune-caches:
        description: On the default branch, delete caches newer ones replaced.
        type: boolean
        default: true
      timeout-minutes:
        description: The check job's limit (a job's default is 6 hours).
        type: number
        default: 60
    secrets:
      private-terms:
        description: The project's private terms, one pattern per line.
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorhawk-software/practices/actions/rust-setup@v1
        with:
          gpui: ${{ inputs.gpui }}
          apt-packages: ${{ inputs.apt-packages }}
          tools: cargo-deny,cargo-machete${{ inputs.coverage && ',cargo-llvm-cov' || '' }}${{ inputs.tools != '' && format(',{0}', inputs.tools) || '' }}
      - uses: dorhawk-software/practices/actions/rust-lint@v1
        with:
          private-terms: ${{ secrets.private-terms }}
      - if: inputs.coverage
        uses: dorhawk-software/practices/actions/rust-coverage@v1
        with:
          extra: ${{ inputs.coverage-extra }}
      - if: ${{ !inputs.coverage }}
        name: Tests
        run: cargo test --workspace --locked

  caches:
    needs: check
    if: ${{ always() && inputs.prune-caches && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - uses: dorhawk-software/practices/actions/prune-caches@v1
